name: Run Tournament Bot

on:
  push:
    branches: [ main, master ]
  schedule:
    # غيخدم راسو كل 5 سوايع باش يتفادى السدان ديال 6 سوايع لي كديرو GitHub
    - cron: "0 */5 * * *" 
  workflow_dispatch:

concurrency: 
  # هاد اللعيبة كتحبس البوت القديم يلا كان باقي خدام باش يخدم الجديد بلا مشاكل
  group: bot-runner
  cancel-in-progress: true 

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Start the Bot
      run: |
        python bot.py
