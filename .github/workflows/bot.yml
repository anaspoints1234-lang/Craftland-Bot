name: Run Telegram Bot 24/7

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/30 * * * *'  # يعيد تشغيل الكود تلقائياً كل 30 دقيقة لضمان عدم توقفه
  workflow_dispatch:

jobs:
  build:
  
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Bot
      run: |
        python bot.py
