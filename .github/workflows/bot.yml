name: Free Fire Bot Runner

on:
  push:
    branches:
      - main
  workflow_dispatch: 
  schedule:
    - cron: '0 */5 * * *' 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Bot
        run: node index.js
